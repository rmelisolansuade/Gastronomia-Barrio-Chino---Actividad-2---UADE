<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBC - Gastronomía Barrio Chino</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .container {
      max-width: 480px;
      width: 100%;
    }
    .status {
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #666666;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin: 0 0 6px 0;
    }
    h2 {
      font-size: 1rem;
      font-weight: 400;
      color: #555555;
      margin: 0 0 24px 0;
    }
    hr {
      border: none;
      border-top: 1px solid #e5e5e5;
      margin: 24px 0;
    }
    .group-info {
      font-size: 0.9rem;
    }
    .group-title {
      font-weight: 600;
      margin-bottom: 12px;
      color: #333333;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      color: #444444;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="status">Próximamente</div>
    <h1>GBC</h1>
    <h2>Gastronomía Barrio Chino</h2>

    <hr>

    <div class="group-info">
      <div class="group-title">Grupo N.º 2</div>
      <ul>
        <li>Integrante 1: Javier Troncoso</li>
        <li>Integrante 2: Renata Meli Solans</li>
        <li>Integrante 3: Nicolás Eitán Panozo</li>
        <li>Integrante 4: Iara Pou</li>
        <li>Integrante 5: Frank Ali López Jimenez</li>
      </ul>
    </div>
  </main>

</body>
</html>
